<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CE108 LIFF</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><style>body{font-family:system-ui;background:#f4f8fc;margin:0;color:#17324d}main{max-width:720px;margin:auto;padding:22px}.hero{background:linear-gradient(120deg,#092b55,#1268b3,#27a4a1);color:white;padding:22px;border-radius:18px}.card{background:white;padding:18px;border-radius:16px;margin-top:16px}</style></head><body><main><section class="hero"><h1>CE108</h1><p>AIが、今やるべき国試問題を選ぶ。</p></section><section class="card"><h2>LIFF接続確認</h2><p id="status">初期化中</p><p>v0.3の接続用雛形です。LIFF ID設定後に今日の問題APIへ接続します。</p></section></main><script>(async()=>{const s=document.getElementById('status'),id='YOUR_LIFF_ID';if(id==='YOUR_LIFF_ID'){s.textContent='LIFF IDが未設定です。';return;}try{await liff.init({liffId:id});s.textContent=liff.isLoggedIn()?'LINEログイン済み':'LINEログインが必要';if(!liff.isLoggedIn())liff.login()}catch(e){s.textContent='初期化失敗: '+e}})()</script></body></html>
